services:
  riftgallery:
    build: .
    image: riftgallery:latest
    container_name: riftgallery
    # Starts automatically with Docker (e.g. after a server reboot) and after crashes.
    restart: unless-stopped
    ports:
      # By default only reachable from the server itself; nginx forwards riftbound.kumilan.com to it.
      # RIFTGALLERY_BIND=0.0.0.0 opens it on all interfaces (plain HTTP, e.g. http://kumilan.com:3001).
      - "${RIFTGALLERY_BIND:-127.0.0.1}:${RIFTGALLERY_PORT:-3001}:3000"
    environment:
      TZ: Europe/Berlin
      # Hours between automatic card database updates from riftcodex.com.
      SYNC_INTERVAL_HOURS: "24"
    volumes:
      # Database and card images. Survives updates and container rebuilds.
      - riftgallery-data:/data

volumes:
  riftgallery-data:
