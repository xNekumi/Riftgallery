# nginx site for RiftGallery.
# Copy to /etc/nginx/sites-available/kumilan.com, link it into sites-enabled,
# then run: sudo certbot --nginx -d kumilan.com -d www.kumilan.com
# certbot adds the HTTPS server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name kumilan.com www.kumilan.com;

    # Backups (JSON import) can be a few MB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
