# nginx site for RiftGallery on riftbound.kumilan.com.
# Copy to /etc/nginx/conf.d/riftbound.conf, then run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d riftbound.kumilan.com
# certbot adds the HTTPS listener and the HTTP -> HTTPS redirect to this file.
# Use RIFTGALLERY_BIND=127.0.0.1 in .env with this setup.

server {
    listen 80;
    listen [::]:80;
    server_name riftbound.kumilan.com;

    # Backups (JSON import) can be a few MB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
